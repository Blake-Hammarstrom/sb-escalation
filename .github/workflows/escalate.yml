# Second Brain escalation runner (Control Plane Step 5). Runs as github-actions[bot], so the owner is notified
# (GitHub doesn't notify you about your own actions). GITHUB_TOKEN: issues write in this repo only; no stored secrets.
name: escalate
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      event: { description: "event type (allowlisted in escalate.py); empty = tick only (manual kick / recovery)", required: false, type: string, default: "" }
      project: { description: "project id", required: false, type: string, default: "" }
      task: { description: "task id (optional)", required: false, type: string, default: "" }
permissions: { contents: read, issues: write }
jobs:
  # A dispatched escalation must never be lost. GitHub's concurrency groups CANCEL a pending run when a newer one queues,
  # so `open` stays outside the group; only `tick` (idempotent, repeated every 5 min) is serialised.
  open:
    if: github.event_name == 'workflow_dispatch' && inputs.event != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Open escalation (inputs validated in Python, never interpolated into shell)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ inputs.event }}
          PROJECT: ${{ inputs.project }}
          TASK: ${{ inputs.task }}
        run: python3 escalate.py open --event "$EVENT" --project "$PROJECT" --task "$TASK"
  tick:
    needs: open
    if: always() && (github.event_name == 'schedule' || needs.open.result == 'success' || needs.open.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: { group: escalate-tick, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Tick (producers, notify, re-alert, park)
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: python3 escalate.py tick
